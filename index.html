                  <button 
                    onClick={() => handlePayment('orangeMoney')}
                    className="w-full p-4 border-2 rounded-lg hover:border-orange-500 hover:bg-orange-50 flex items-center gap-4"
                  >
                    <div className="w-12 h-12 bg-orange-500 rounded-lg flex items-center justify-center text-2xl">
                      📱
                    </div>
                    <div className="text-left flex-1">
                      <p className="font-semibold">Orange Money</p>
                      <p className="text-sm text-gray-600">Cameroun & Côte d'Ivoire</p>
                    </div>
                  </button>

                  <button 
                    onClick={() => handlePayment('wave')}
                    className="w-full p-4 border-2 rounded-lg hover:border-blue-500 hover:bg-blue-50 flex items-center gap-4"
                  >
                    <div className="w-12 h-12 bg-blue-500 rounded-lg flex items-center justify-center text-2xl">
                      📱
                    </div>
                    <div className="text-left flex-1">
                      <p className="font-semibold">Wave</p>
                      <p className="text-sm text-gray-600">Côte d'Ivoire</p>
                    </div>
                  </button>
                </div>

                <button 
                  onClick={() => setShowPaymentModal(false)}
                  className="w-full py-3 border-2 rounded-lg font-medium"
                >
                  {lang === 'fr' ? 'Annuler' : 'Cancel'}
                </button>
              </div>
            </div>
          )}

          {/* REVIEW MODAL */}
          {showReviewModal && selectedOrder && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-lg max-w-lg w-full p-6">
                <h2 className="text-2xl font-bold mb-4">
                  ⭐ {lang === 'fr' ? 'Laisser un Avis' : 'Leave a Review'}
                </h2>
                
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const rating = parseInt(e.target.rating.value);
                  const comment = e.target.comment.value;
                  handleSubmitReview(rating, comment);
                }}>
                  <div className="mb-4">
                    <label className="block text-sm font-medium mb-2">
                      {lang === 'fr' ? 'Note' : 'Rating'}
                    </label>
                    <div className="flex gap-2">
                      {[1,2,3,4,5].map(star => (
                        <label key={star} className="cursor-pointer">
                          <input 
                            type="radio" 
                            name="rating" 
                            value={star} 
                            defaultChecked={star === 5}
                            className="hidden"
                          />
                          <div className="text-3xl text-yellow-500 hover:scale-110 transition">⭐</div>
                        </label>
                      ))}
                    </div>
                  </div>

                  <div className="mb-6">
                    <label className="block text-sm font-medium mb-2">
                      {lang === 'fr' ? 'Votre Commentaire' : 'Your Comment'}
                    </label>
                    <textarea 
                      name="comment"
                      placeholder={lang === 'fr' ? 'Partagez votre expérience...' : 'Share your experience...'}
                      className="w-full p-3 border rounded-lg focus:border-green-500 focus:outline-none"
                      rows={4}
                      required
                    />
                  </div>

                  <div className="flex gap-3">
                    <button 
                      type="submit"
                      className="flex-1 py-3 rounded-lg font-medium text-white"
                      style={{backgroundColor: '#1dbf73'}}
                    >
                      {lang === 'fr' ? 'Publier l\'Avis' : 'Submit Review'}
                    </button>
                    <button 
                      type="button"
                      onClick={() => setShowReviewModal(false)}
                      className="flex-1 py-3 border-2 rounded-lg font-medium"
                    >
                      {lang === 'fr' ? 'Plus Tard' : 'Later'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-gray-900 text-white py-8 mt-16">
            <div className="max-w-7xl mx-auto px-4 text-center">
              <p className="text-sm mb-2">© 2026 AfriWork • Paiement Sécurisé • Cameroun & Côte d'Ivoire</p>
              <p className="text-xs text-gray-400">
                🎉 DEMO with {categories.length}+ categories • Reviews & Ratings • Profile System • Email Confirmations
              </p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<AfriWorkComplete />, document.getElementById('root'));
  </script>
</body>
</html>
